<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline';">
  <title>Proxmox VE — Google Drive OAuth Callback</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --border: #d0d7de;
      --accent: #e57000;
      --accent-hover: #c85f00;
      --ok: #1a7f37;
      --err: #cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --card: #1f232a;
        --text: #e6edf3;
        --muted: #9198a1;
        --border: #30363d;
      }
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: calc(100vh - 48px);
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    p {
      margin: 0 0 16px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }
    .status {
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 84px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      resize: vertical;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      border: 0;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Proxmox VE — Google Drive Authorization</h1>
    <div id="status" class="status">Processing OAuth callback…</div>
    <p id="detail">Returning authorization result to the Proxmox VE Web UI.</p>
    <div id="fallback" class="hidden">
      <textarea id="payloadBox" readonly aria-label="Authorization code"></textarea>
      <div class="actions">
        <button id="copyBtn" type="button">Copy Authorization Code</button>
        <button id="closeBtn" type="button" class="secondary">Close Window</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search || "");
      var code = params.get("code") || "";
      var state = params.get("state") || "";
      var error = params.get("error") || "";
      var errorDesc = params.get("error_description") || "";

      var statusEl = document.getElementById("status");
      var detailEl = document.getElementById("detail");
      var fallbackEl = document.getElementById("fallback");
      var payloadBox = document.getElementById("payloadBox");
      var copyBtn = document.getElementById("copyBtn");
      var closeBtn = document.getElementById("closeBtn");

      var message = {
        type: "pve-gdrive-oauth-code",
        code: code,
        state: state,
        error: error,
        error_description: errorDesc
      };

      var posted = false;
      try {
        if (window.opener && typeof window.opener.postMessage === "function") {
          window.opener.postMessage(message, window.location.origin);
          posted = true;
        }
      } catch (_e) {
        posted = false;
      }

      if (error) {
        statusEl.textContent = "Google authorization failed: " + error;
        statusEl.className = "status err";
        detailEl.textContent = errorDesc || "You may close this window and retry from Proxmox VE.";
      } else if (code) {
        statusEl.textContent = posted
          ? "Authorization complete — returning to Proxmox VE…"
          : "Authorization code received.";
        statusEl.className = "status ok";
        detailEl.textContent = posted
          ? "This window will close automatically. If it stays open, copy the code below into Proxmox VE."
          : "Copy the authorization code below and paste it into the Proxmox VE Google Drive wizard.";
        payloadBox.value = code;
        fallbackEl.className = "";
      } else {
        statusEl.textContent = "Missing authorization parameters.";
        statusEl.className = "status err";
        detailEl.textContent = "No code or error parameter was returned in the callback URL.";
      }

      copyBtn.addEventListener("click", function () {
        payloadBox.select();
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          navigator.clipboard.writeText(payloadBox.value).then(function () {
            copyBtn.textContent = "Copied!";
          }).catch(function () {
            document.execCommand("copy");
            copyBtn.textContent = "Copied!";
          });
        } else {
          document.execCommand("copy");
          copyBtn.textContent = "Copied!";
        }
      });

      closeBtn.addEventListener("click", function () {
        window.close();
      });

      if (posted && code && !error) {
        setTimeout(function () {
          try {
            window.close();
          } catch (_e) {}
        }, 400);
      }
    })();
  </script>
</body>
</html>
